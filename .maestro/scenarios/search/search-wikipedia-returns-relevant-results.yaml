appId: org.wikipedia
name: Search - a query typed into Wikipedia Search returns visible results
tags:
  - android
  - smoke
  - critical
  - search
  - production-safe
env:
  APP_ID: org.wikipedia
  QUERY: "Software testing"
onFlowStart:
  - runFlow: ../../helpers/complete-onboarding-android.yaml
onFlowComplete:
  - runFlow:
      file: ../../helpers/take-screenshot.yaml
      env:
        APP_ID: ${APP_ID}
        SCREENSHOT_NAME: search-wikipedia-returns-relevant-results
---
# Scenario: a user opens the Search tab, types a query, and sees results for
# it. Deliberately selector-free - it only composes flows (enforced by
# scripts/src/lint/check-flow-conventions.ts) so it reads as the source of
# truth for what this scenario does.
- runFlow:
    file: ../../helpers/navigate-to-search-tab.yaml
    env:
      APP_ID: ${APP_ID}
- runFlow:
    file: ../../flows/search/perform-search.yaml
    env:
      APP_ID: ${APP_ID}
      QUERY: ${QUERY}
- runFlow:
    file: ../../flows/search/assert-search-query-visible.yaml
    env:
      APP_ID: ${APP_ID}
      QUERY: ${QUERY}

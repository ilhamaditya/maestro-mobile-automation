# Maestro workspace configuration.
# Reference: https://docs.maestro.dev/reference/workspace-configuration
#
# `flows` intentionally globs ONLY scenarios/**. flows/ and helpers/ live
# alongside it but must only ever be invoked via `runFlow` from a scenario -
# never picked up here as standalone top-level tests. This is what enforces
# "scenarios are the only executable layer" (docs/Architecture.md) at the
# tooling level, not just in prose.
flows:
  - scenarios/**/*.yaml

# `wip`-tagged flows are excluded by default so in-progress work never blocks
# a smoke run. Override at the CLI with --include-tags wip when iterating.
excludeTags:
  - wip

executionOrder:
  continueOnFailure: true

platform:
  android:
    disableAnimations: true
  ios:
    disableAnimations: true

appId: org.wikipedia
name: Search - a query typed into Wikipedia Search returns visible results
tags:
  - android
  - smoke
  - critical
  - search
  - production-safe
env:
  QUERY: "Software testing"
onFlowStart:
  - runFlow: ../../sub-flows/complete-onboarding-android.yaml
onFlowComplete:
  - runFlow:
      file: ../../sub-flows/take-screenshot.yaml
      env:
        APP_ID: org.wikipedia
        SCREENSHOT_NAME: search-wikipedia-returns-relevant-results
---
# Business scenario: a user opens the Search tab, types a query, and sees
# results for it. This file is deliberately selector-free - it only composes
# reusable flows (enforced by tools/src/lint/check-flow-conventions.ts) so it
# stays readable to a non-technical stakeholder as living documentation. See
# features/search-wikipedia.feature for the plain-language scenario this maps to.
- runFlow:
    file: ../../common-components/bottom-nav/navigate-to-search-tab.yaml
    env:
      APP_ID: org.wikipedia
- runFlow:
    file: ../../reusable/search/perform-search.yaml
    env:
      APP_ID: org.wikipedia
      QUERY: ${QUERY}
- runFlow:
    file: ../../reusable/search/assert-search-query-visible.yaml
    env:
      APP_ID: org.wikipedia
      QUERY: ${QUERY}

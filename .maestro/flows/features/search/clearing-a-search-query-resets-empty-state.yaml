appId: org.wikipedia
name: Search - clearing a query resets Search back to its empty state
tags:
  - android
  - smoke
  - search
  - production-safe
env:
  QUERY: "Software testing"
onFlowStart:
  - runFlow: ../../sub-flows/complete-onboarding-android.yaml
onFlowComplete:
  - runFlow:
      file: ../../sub-flows/take-screenshot.yaml
      env:
        APP_ID: org.wikipedia
        SCREENSHOT_NAME: clearing-a-search-query-resets-empty-state
---
# Business scenario: a user who changes their mind mid-search can clear the
# query and land back on an empty, unambiguous state rather than a stale or
# confusing screen. Shares perform-search.yaml with the happy-path scenario -
# the concrete proof-of-no-duplication for this vertical slice.
- runFlow:
    file: ../../common-components/bottom-nav/navigate-to-search-tab.yaml
    env:
      APP_ID: org.wikipedia
- runFlow:
    file: ../../reusable/search/perform-search.yaml
    env:
      APP_ID: org.wikipedia
      QUERY: ${QUERY}
- runFlow:
    file: ../../reusable/search/assert-search-query-visible.yaml
    env:
      APP_ID: org.wikipedia
      QUERY: ${QUERY}
- runFlow: ../../reusable/search/clear-search-query.yaml
- runFlow:
    file: ../../reusable/search/assert-search-empty-state.yaml
    env:
      QUERY: ${QUERY}
